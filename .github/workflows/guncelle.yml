name: Öğlen Otomatik Ürün Güncelleme

on:
  schedule:
    - cron: '0 9 * * *' 
  workflow_dispatch: 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Botun dosyayı kaydedebilmesi için gerekli yazma izni

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4 # Hata vermemesi için v4'e yükseltildi

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4 # Hata vermemesi için v4'e yükseltildi
        with:
          node-version: '20'

      - name: Gerekli Paketleri Yükle
        run: npm install

      - name: Botu Çalıştır ve Verileri Çek
        run: node scraper.js

      - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add products.json
          git commit -m "Öğlen otomatik ürün güncellemesi" || echo "Değişiklik yok"
          git push
